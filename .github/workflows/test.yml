name: Test

# Su main a ogni push, sugli altri rami tramite la pull request (una sola esecuzione per modifica).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Tipi, unit, API e browser
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Controllo dei tipi
        run: npm run typecheck
      - name: Test unitari e delle API
        run: npm test
      - name: Browser per i test end-to-end
        run: npx playwright install --with-deps chromium
      - name: Test end-to-end (telefono simulato)
        run: npm run test:e2e
      - name: Rapporto dei test nel browser
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  docker:
    name: Container Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build, avvio e verifica con docker compose
        run: bash tests/docker/smoke.sh
